name: Validate RenLite
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/hotel-team-access]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5 firebase-tools@14
      - run: npx firebase emulators:exec --config firebase.test.json --project demo-renlite-test --only firestore "node --test tests/hotel-access.test.mjs"
